name: V1.0 verification
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check release files and versions
        run: python scripts/check_release.py
      - name: Install exact Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install frontend from lockfile
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build production frontend
        working-directory: web
        run: npm run build
      - name: Run complete isolated production workflow
        run: python -m pytest tests -q --junitxml=tests/output/ci-results.xml
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: tests/output/ci-results.xml
