services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CATSTUDIO_DOMAIN: ${CATSTUDIO_DOMAIN:-maopian.migucomi.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  caddy_data:
  caddy_config:
